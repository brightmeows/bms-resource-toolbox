[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]

# ── Async runtime ──
tokio = { version = "1", features = ["full"] }

# ── CLI ──
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Error handling ──
thiserror = "2"
anyhow = "1"

# ── Serialization ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Tracing ──
tracing = "0.1"

# ── Cryptography ──
sha2 = "0.11"

# ── Filesystem ──
filetime = "0.2"
regex = "1"
encoding_rs = "0.8"

# ── Archives ──
zip = "8"
sevenz-rust = "0.6"

# ── Date / time ──
chrono = "0.4"

# ── External tools ──
webbrowser = "1"
rust_xlsxwriter = "0.94"

# ── Dev / Bench ──
tempfile = "3"
criterion = { version = "0.8", features = ["async_tokio"] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = "warn"

[profile.release]
lto = true
